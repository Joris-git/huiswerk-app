<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Dit bestand is de bron. Voor de claude.ai-versie: alles tussen <head> en </body> zonder deze omhulling publiceren. -->
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Oefenschrift</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Grandstander:wght@600;800&display=swap">
<style>
/* Layout: één kolom als een schriftpagina met rode kantlijn. Licht = schrift, donker = schoolbord. */
:root{
  --paper:#F4F7FB; --rule:#DCE5EF; --card:#FFFFFF; --ink:#1B2643; --ink-2:#56627B; --margin:#DE6B6B;
  --accent:#2C52D0; --accent-dark:#1D3A9E; --accent-ink:#FFFFFF;
  --good:#1F7A45; --good-bg:#E2F2E7; --again:#9A6406; --again-bg:#FBEFD6;
  --kind-1:#C95F1C; --kind-2:#1A8274; --kind-3:#7A4FC9; --kind-4:#2C6ED0; --wood:#E9C58F; --wood-2:#C29A62; --shadow:rgba(27,38,67,.10); --chip-ink:#FFFFFF;
  --f-display:"Grandstander","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1C2925; --rule:#36483F; --card:#24332E; --ink:#EEF2EA; --ink-2:#A8B7AE; --margin:#C77B7B;
  --accent:#8EADFF; --accent-dark:#5F7FD6; --accent-ink:#0F1A33;
  --good:#7FD69A; --good-bg:#21412F; --again:#F2C46A; --again-bg:#45391F;
  --kind-1:#F29A5C; --kind-2:#57CDBB; --kind-3:#B79BF2; --kind-4:#7FB0FF; --wood:#B8946A; --wood-2:#7E6243; --shadow:rgba(0,0,0,.30); --chip-ink:#10201B; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1C2925; --rule:#36483F; --card:#24332E; --ink:#EEF2EA; --ink-2:#A8B7AE; --margin:#C77B7B;
  --accent:#8EADFF; --accent-dark:#5F7FD6; --accent-ink:#0F1A33;
  --good:#7FD69A; --good-bg:#21412F; --again:#F2C46A; --again-bg:#45391F;
  --kind-1:#F29A5C; --kind-2:#57CDBB; --kind-3:#B79BF2; --kind-4:#7FB0FF; --wood:#B8946A; --wood-2:#7E6243; --shadow:rgba(0,0,0,.30); --chip-ink:#10201B; color-scheme:dark}

html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.15rem}
p{margin:0}
a{color:var(--accent)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--rule)}
.top-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--f-display);font-weight:800;font-size:1.2rem;background:none;border:0;padding:0;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:8px}
.logo .mini-potlood{width:34px;height:10px}
.top .ruimte{flex:1}
.kindchip{font-weight:700;padding:3px 12px;border-radius:99px;color:var(--chip-ink);background:var(--kind,var(--accent));font-size:.95rem}
.ikoonknop{background:var(--card);border:2px solid var(--rule);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:.9rem;font-weight:700;color:var(--ink-2)}

.pagina{max-width:780px;margin:0 auto;padding-block:22px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
@media (min-width:860px){.pagina{border-left:2px solid var(--margin);padding-left:32px}}

.kaart{background:var(--card);border:2px solid var(--rule);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sub{color:var(--ink-2)}
.klein{font-size:.88rem}
.label{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.rij{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stapel{display:flex;flex-direction:column;gap:10px}

.knop{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;font-weight:700;font-size:1.02rem;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-dark);transform:translateY(0);transition:transform .08s,box-shadow .08s;text-decoration:none}
.knop:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-dark)}
.knop.zacht{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--rule);border:2px solid var(--rule)}
.knop.groot{padding:16px 26px;font-size:1.15rem}
.knop.klein{padding:8px 14px;font-size:.92rem}
.knop[disabled]{opacity:.45;cursor:default}
.tekstknop{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}

/* potlood */
.potlood{position:relative;height:18px;width:100%;max-width:220px;background:var(--kleur,var(--accent));border-radius:3px 0 0 3px;margin-right:22px}
.potlood::before{content:"";position:absolute;right:-22px;top:0;width:22px;height:100%;background:var(--wood);clip-path:polygon(0 0,100% 50%,0 100%)}
.potlood::after{content:"";position:absolute;right:-22px;top:calc(50% - 3px);width:7px;height:6px;background:var(--kleur,var(--accent));clip-path:polygon(0 0,100% 50%,0 100%);transform:translateX(15px)}
.mini-potlood{display:inline-block;position:relative;background:var(--accent);border-radius:2px 0 0 2px;margin-right:9px}
.mini-potlood::before{content:"";position:absolute;right:-9px;top:0;width:9px;height:100%;background:var(--wood);clip-path:polygon(0 0,100% 50%,0 100%)}

/* kies kind */
.kinderen{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.kindkaart{all:unset;cursor:pointer;background:var(--card);border:2px solid var(--rule);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 5px 0 var(--rule)}
.kindkaart:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.kindkaart:active{transform:translateY(3px);box-shadow:0 2px 0 var(--rule)}
.kindkaart .naam{font-family:var(--f-display);font-weight:800;font-size:2.2rem;color:var(--kleur)}
.kindkaart .stats{display:flex;gap:16px;color:var(--ink-2);font-weight:700;font-size:.95rem}

/* lijstkaarten */
.lijstkaart{all:unset;cursor:pointer;background:var(--card);border:2px solid var(--rule);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lijstkaart:hover{border-color:var(--accent)}
.lijstkaart:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.chip{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--paper);border:1.5px solid var(--rule);color:var(--ink-2)}
.chip.toets{background:var(--again-bg);border-color:transparent;color:var(--again)}
.chip.engels{color:var(--accent)}
.chip.spelling{color:var(--good)}
.chip.vb{border-style:dashed}

/* liniaal */
.liniaal{position:relative;background:var(--wood);border-radius:6px;padding:0 10px 14px;display:flex;align-items:flex-start;gap:3px;min-height:46px;overflow:hidden;
  background-image:repeating-linear-gradient(to right,#3B2A1259 0 1px,transparent 1px 8px);background-size:100% 7px;background-repeat:no-repeat;background-position:0 100%}
.liniaal .streep{flex:1;min-width:3px;border-radius:0 0 3px 3px;background:var(--wood-2)}
.liniaal .streep[data-b="1"]{background:var(--again)}
.liniaal .streep[data-b="2"]{background:var(--accent)}
.liniaal .streep[data-b="3"],.liniaal .streep[data-b="4"],.liniaal .streep[data-b="5"]{background:var(--good)}
.liniaal-uitleg{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--ink-2)}
.liniaal-uitleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* planner */
.planner{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.dag{border:2px solid var(--rule);border-radius:10px;padding:6px 4px;text-align:center;font-size:.82rem;color:var(--ink-2);background:var(--card)}
.dag b{display:block;font-size:1.05rem;color:var(--ink);font-variant-numeric:tabular-nums}
.dag.gedaan{border-color:var(--good);background:var(--good-bg)}
.dag.gedaan::after{content:"geoefend";display:block;font-size:.66rem;font-weight:700;color:var(--good)}
.dag.vandaag{border-color:var(--accent)}
.dag.toetsdag{border-color:var(--again);background:var(--again-bg)}
.dag.toetsdag::after{content:"toets";display:block;font-size:.66rem;font-weight:700;color:var(--again)}

/* sessie */
.voortgang{height:10px;background:var(--rule);border-radius:99px;overflow:hidden}
.voortgang i{display:block;height:100%;background:var(--kind,var(--accent));border-radius:99px;transition:width .3s}
.vraagkop{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--ink-2);font-weight:700;font-size:.92rem}
.sterteller{display:inline-flex;align-items:center;gap:6px;color:var(--again);font-weight:800}
.ster{width:18px;height:18px;display:inline-block;background:currentColor;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.vraag{background:var(--card);border:2px solid var(--rule);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.opdracht{font-weight:700;color:var(--ink-2)}
.woordgroot{font-family:var(--f-body);font-weight:700;font-size:clamp(1.7rem,6vw,2.5rem);line-height:1.2;display:flex;align-items:center;gap:12px;flex-wrap:wrap;overflow-wrap:anywhere}
.woordmidden{font-size:clamp(1.25rem,4.5vw,1.7rem);font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.situatie{background:var(--paper);border-left:4px solid var(--kind,var(--accent));padding:10px 14px;border-radius:0 10px 10px 0;font-size:1.02rem}
.spreek{border:2px solid var(--rule);background:var(--paper);border-radius:99px;width:46px;height:46px;cursor:pointer;display:inline-grid;place-items:center;flex:none;color:var(--accent)}
.spreek.groot{width:84px;height:84px}
.spreek svg{width:55%;height:55%}
.opties{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.optie{border:2px solid var(--rule);background:var(--card);border-radius:14px;padding:14px 16px;text-align:left;font-weight:700;font-size:1.05rem;cursor:pointer;box-shadow:0 3px 0 var(--rule);overflow-wrap:anywhere}
.optie:hover:not([disabled]){border-color:var(--accent)}
.optie.juist{border-color:var(--good);background:var(--good-bg);color:var(--good);box-shadow:0 3px 0 var(--good)}
.optie.mis{border-color:var(--again);background:var(--again-bg);color:var(--again);box-shadow:none}
.optie[disabled]{cursor:default}
.optie small{display:block;font-weight:400;color:var(--ink-2);font-size:.85rem;margin-top:2px}
.invoer{width:100%;font-size:1.5rem;font-weight:700;padding:12px 14px;border:2px solid var(--rule);border-radius:12px;background:var(--paper);letter-spacing:.02em}
.invoer:focus{border-color:var(--accent);outline:none}
.slots{display:flex;flex-wrap:wrap;gap:14px;row-gap:10px}
.slotwoord{display:flex;gap:4px}
.slot{width:34px;height:44px;border-bottom:3px solid var(--ink-2);display:grid;place-items:center;font-size:1.5rem;font-weight:700;cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;padding:0}
.slot.vol{border-bottom-color:var(--accent);color:var(--accent)}
.tegels{display:flex;flex-wrap:wrap;gap:8px}
.tegel{min-width:44px;height:48px;padding:0 12px;border-radius:10px;border:2px solid var(--rule);background:var(--card);font-weight:700;font-size:1.3rem;cursor:pointer;box-shadow:0 3px 0 var(--rule)}
.tegel.woord{font-size:1.08rem}
.tegel[disabled]{opacity:.2;cursor:default;box-shadow:none}
.zinrij{min-height:56px;border:2px dashed var(--rule);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.terugkoppeling{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.terugkoppeling.goed{background:var(--good-bg);color:var(--good)}
.terugkoppeling.fout,.terugkoppeling.bijna{background:var(--again-bg);color:var(--again)}
.terugkoppeling .kop{font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.terugkoppeling .antwoord{color:var(--ink);font-size:1.25rem;font-weight:700;overflow-wrap:anywhere}
.terugkoppeling p{color:var(--ink)}
mark{background:var(--again);color:var(--card);border-radius:3px;padding:0 1px}
.regelkaart{border:2px solid var(--rule);border-radius:12px;padding:12px 14px;background:var(--paper);display:flex;flex-direction:column;gap:4px}
.regelkaart .catnaam{font-family:var(--f-display);font-weight:800;color:var(--good)}
.hint{font-size:1.1rem;letter-spacing:.12em;font-weight:700;color:var(--ink-2)}

.lijstje{display:flex;flex-wrap:wrap;gap:8px}
.lijstje span{background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:3px 10px;font-weight:700;font-size:.95rem}
.lijstje.mis span{border-color:var(--again);color:var(--again)}

.groottal{font-family:var(--f-display);font-weight:800;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.tabel{width:100%;border-collapse:collapse;font-size:.95rem}
.tabel th,.tabel td{text-align:left;padding:8px 6px;border-bottom:1.5px solid var(--rule);vertical-align:top}
.tabel th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.tabelbak{overflow-x:auto}
.bakjes{display:inline-flex;gap:2px;vertical-align:middle}
.bakjes i{width:8px;height:12px;border-radius:2px;background:var(--rule)}
.bakjes i.aan{background:var(--good)}

.veld{display:flex;flex-direction:column;gap:6px}
.veld label,.veld .vlabel{font-weight:700;font-size:.92rem}
.veld input[type=text],.veld input[type=date],.veld textarea,.veld select{border:2px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--paper);width:100%}
.veld textarea{min-height:220px;font-size:.98rem;line-height:1.5}
.keuzes{display:flex;flex-wrap:wrap;gap:8px}
.keuzes label{display:inline-flex;gap:6px;align-items:center;border:2px solid var(--rule);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:700}
.voorbeeld{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.voorbeeld select{border:2px solid var(--rule);border-radius:8px;padding:4px 6px;background:var(--paper);max-width:100%}
.melding{border-radius:12px;padding:12px 14px;background:var(--again-bg);color:var(--again);font-weight:700}
.melding.ok{background:var(--good-bg);color:var(--good)}
.leeg{text-align:center;padding:30px 18px;color:var(--ink-2)}
.voet{text-align:center;color:var(--ink-2);font-size:.88rem}

@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.pop{animation:pop .35s ease-out}
@keyframes schud{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.schud{animation:schud .25s 2}
@media (prefers-reduced-motion: reduce){.pop,.schud{animation:none}.knop,.voortgang i{transition:none}}
@media (max-width:520px){h1{font-size:1.6rem}.vraag{padding:16px}.kaart{padding:14px}.slot{width:28px;height:40px;font-size:1.3rem}}

/* v2: munten, figuur, winkel, code, lezen, stappen */
:root{--coin:#E3A21A;--coin-rand:#B07A0C}
.munt{display:inline-block;width:1.05em;height:1.05em;border-radius:50%;background:var(--coin);box-shadow:inset 0 0 0 2px var(--coin-rand);vertical-align:-.15em;position:relative}
.munt::after{content:"";position:absolute;inset:28%;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--coin-rand)}
.munten{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.figuur{display:block;flex:none}
.figuurrij{display:flex;align-items:center;gap:14px;min-width:0}
.figuurrij .tekstblok{display:flex;flex-direction:column;gap:2px;min-width:0}
.ballon{background:var(--card);border:2px solid var(--rule);border-radius:14px;padding:8px 12px;font-weight:700;position:relative}
.stappen{display:flex;gap:6px;flex-wrap:wrap}
.stap{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:99px;border:1.5px solid var(--rule);color:var(--ink-2);background:var(--card)}
.stap.nu{border-color:var(--kind,var(--accent));color:var(--ink);background:var(--paper)}
.stap.klaar{color:var(--good);border-color:var(--good)}
.lesdoel{border-left:5px solid var(--kind,var(--accent));padding-left:14px;display:flex;flex-direction:column;gap:6px}
.denkstap{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start}
.denkstap b.nr{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:2px solid var(--rule);font-size:.9rem}
.winkelgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ding{background:var(--card);border:2px solid var(--rule);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.ding .prijs{font-weight:800;display:inline-flex;gap:6px;align-items:center}
.ding.heb{border-color:var(--good)}
.spaar{height:12px;background:var(--rule);border-radius:99px;overflow:hidden}
.spaar i{display:block;height:100%;background:var(--coin);border-radius:99px}
.medailles{display:flex;gap:10px;flex-wrap:wrap}
.medaille{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.7rem;color:#2B1D05;border:3px solid #0000001f}
.medaille.brons{background:#D79A63}.medaille.zilver{background:#C9D1D8}.medaille.goud{background:#F2C14E}
.medaille.leeg{background:transparent;border:2px dashed var(--rule);color:var(--ink-2)}
.geluidknop{display:inline-flex;align-items:center;gap:6px}.geluidknop svg{width:18px;height:18px}.geluidknop.uit svg{opacity:.35}
@media (max-width:520px){.geluidknop .gt{display:none}.logo{font-size:1.05rem}}
.pinpunten{display:flex;gap:12px;justify-content:center}
.pinpunten i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink-2)}
.pinpunten i.vol{background:var(--ink);border-color:var(--ink)}
.toetsenbord{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.toetsenbord button{height:60px;border-radius:14px;border:2px solid var(--rule);background:var(--card);font-size:1.4rem;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--rule)}
.leestekst{font-size:1.12rem;line-height:1.75;display:flex;flex-direction:column;gap:12px;max-width:65ch}
.leestekst .lw{background:linear-gradient(transparent 62%,var(--again-bg) 62%);font-weight:700}
.lezingen{display:flex;gap:8px;flex-wrap:wrap}
</style>

</head>
<body>
<header class="top"><div class="top-in" id="kop"></div></header>
<main class="pagina" id="app" aria-live="polite"></main>

<script>
(function(){
"use strict";

/* ---------- vaste gegevens ---------- */
// De kinderen staan niet in de code: ouders voeren ze in bij "Voor ouders" (instellingen.kinderen).
let KINDEREN=[];
const KLEUREN=[["oranje","var(--kind-1)"],["groen","var(--kind-2)"],["paars","var(--kind-3)"],["blauw","var(--kind-4)"]];
function zetKinderen(){

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const schud=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const kies=a=>a[Math.floor(Math.random()*a.length)];
const kloon=o=>JSON.parse(JSON.stringify(o||{}));
function dag(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function vanIso(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function plusDagen(s,n){const d=vanIso(s);d.setDate(d.getDate()+n);return dag(d)}
function dagenTot(s){return Math.round((vanIso(s)-vanIso(dag()))/864e5)}
function maandagVan(s){const d=vanIso(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return dag(d)}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function zonderHaakjes(s){return String(s).replace(/\s*\(.*?\)\s*/g," ").trim()}
function alts(s){return zonderHaakjes(s).split("/").map(x=>x.trim()).filter(Boolean)}
function eerste(s){return alts(s)[0]||zonderHaakjes(s)}
function norm(s){
  return String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\(.*?\)/g," ")
    .replace(/\b(what|it|that|here|there|he|she|who|where)'s\b/g,"$1 is")
    .replace(/\bcan't\b/g,"can not").replace(/\bcannot\b/g,"can not").replace(/\bwon't\b/g,"will not")
    .replace(/n't\b/g," not").replace(/\bi'm\b/g,"i am").replace(/'re\b/g," are").replace(/'ll\b/g," will")
    .replace(/[.,!?;:"']/g," ").replace(/\s+/g," ").trim();
}
function normNL(s){return norm(s).replace(/^(de|het|een)\s+/,"")}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function beoordeel(invoer,juist,taal){
  const f=taal==="nl"?normNL:norm;const a=f(invoer);if(!a)return"fout";
  const opties=alts(juist);
  if(opties.some(o=>f(o)===a))return"goed";
  const best=Math.min(...opties.map(o=>lev(f(o),a)));const L=f(opties[0]).length;
  if((L>=4&&best<=1)||(L>=10&&best<=2))return"bijna";
  return"fout";
}
function markeer(juist,invoer){
  const A=juist.toLowerCase(),B=String(invoer||"").toLowerCase();const n=A.length,m=B.length;
  const t=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)t[i][j]=A[i]===B[j]?t[i+1][j+1]+1:Math.max(t[i+1][j],t[i][j+1]);
  const houd=new Array(n).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(A[i]===B[j]){houd[i]=true;i++;j++}else if(t[i+1][j]>=t[i][j+1])i++;else j++}
  return juist.split("").map((c,k)=>houd[k]||c===" "?esc(c):"<mark>"+esc(c)+"</mark>").join("");
}
function raadCat(w){
  w=String(w).toLowerCase().trim();
  if(w.length>4&&/(pje|tje|etje|je)$/.test(w))return"klein";
  if(/(eeuw|ieuw)/.test(w))return"eeuw";
  if(/(aai|ooi|oei)/.test(w))return"aai";
  if(/cht/.test(w))return"lucht";
  if(/nk$/.test(w))return"plank";
  if(/ng$/.test(w))return"zing";
  if(/(eer|oor|eur)$/.test(w))return"eer";
  if(/[db]$/.test(w))return"lang";
  if(/([bcdfgklmnprstvz])\1[aeiou]/.test(w))return"dubbel";
  if(/(^|[^aeiou])[aeou][bcdfgklmnprstvwz][aeiou]/.test(w))return"klank";
  if(/(ei|ij|au|ou)/.test(w))return"weet";
  return"hak";
}

const kanPraten=("speechSynthesis" in window)&&typeof SpeechSynthesisUtterance!=="undefined";

function laadStemmen(){try{stemmen=speechSynthesis.getVoices()||[]}catch(e){stemmen=[]}}

function zeg(tekst,taal,traag){
  if(!kanPraten||!S.geluid||!tekst)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(traag?String(tekst):zonderHaakjes(tekst).split("/")[0]);u.lang=taal;
    const v=stemmen.find(v=>v.lang.replace("_","-")===taal)||stemmen.find(v=>v.lang.toLowerCase().startsWith(taal.slice(0,2)));
    if(v)u.voice=v;u.rate=taal.startsWith("en")?0.85:0.8;speechSynthesis.speak(u)}catch(e){}
}
let actx=null;
function toon(soort){
  if(!S.geluid)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const nu=actx.currentTime;
    const noten=soort==="goed"?[660,880]:soort==="munt"?[988,1319]:soort==="ster"?[660,880,1320]:[300,250];
    noten.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=soort==="fout"?"triangle":"sine";o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,nu+i*0.09);g.gain.exponentialRampToValueAtTime(0.12,nu+i*0.09+0.02);g.gain.exponentialRampToValueAtTime(0.0001,nu+i*0.09+0.18);
      o.connect(g);g.connect(actx.destination);o.start(nu+i*0.09);o.stop(nu+i*0.09+0.2)})}catch(e){}
}

const S={scherm:"kies",kind:null,lijstId:null,lijsten:[],vg:{},inst:{pins:{},beloningen:[],kinderen:[]},laden:true,laadTraag:false,modus:"laden",

function leegVg(){return{lijsten:{},munten:0,reeks:{laatste:"",dagen:0},dagen:[],figuur:{naam:"",items:[],aan:[]},aanvragen:[],doel:null}}
function vulAan(v){
  const n=Object.assign(leegVg(),v||{});
  if(typeof n.munten!=="number")n.munten=0;
  if(n.sterren&&!n.omgezet){n.munten+=n.sterren;n.omgezet=true;delete n.sterren}
  n.figuur=Object.assign({naam:"",items:[],aan:[]},n.figuur||{});
  n.dagen=n.dagen||[];n.aanvragen=n.aanvragen||[];
  return n;
}
function kind(){return KINDEREN.find(k=>k.id===S.kind)}
function lijst(id){return S.lijsten.find(l=>l.id===(id||S.lijstId))}
function lijstenVoor(kid){return S.lijsten.filter(l=>!l.voor||!l.voor.length||l.voor.includes(kid))
  .sort((a,b)=>(a.toets&&dagenTot(a.toets)>=0?a.toets:"9")<(b.toets&&dagenTot(b.toets)>=0?b.toets:"9")?-1:1)}
function itemsVan(l){return(l.items||[]).map(it=>l.soort==="spelling"?Object.assign({},it,{key:"s:"+it.w}):Object.assign({},it,{key:"e:"+it.en}))}
function lv(kid,lid){const v=S.vg[kid];v.lijsten=v.lijsten||{};if(!v.lijsten[lid])v.lijsten[lid]={it:{},dagen:[],toetsen:[]};const p=v.lijsten[lid];p.it=p.it||{};p.dagen=p.dagen||[];p.toetsen=p.toetsen||[];return p}
function bak(p,key){return(p.it[key]&&p.it[key].b)||0}
function stand(kid,l){const p=lv(kid,l.id);const its=itemsVan(l);const zeker=its.filter(i=>bak(p,i.key)>=3).length;return{p,its,zeker,n:its.length}}
function geef(n){const v=S.vg[S.kind];v.munten=(v.munten||0)+n;if(S.sessie)S.sessie.munten=(S.sessie.munten||0)+n}

/* ---------- opslag ---------- */
const opslag={db:null,vuil:{},bezig:{},opnieuw:{},timers:{}};
async function startOpslag(){
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){db=null}
  if(!db){
    S.modus="lokaal";S.lijsten=lsGet("oefenschrift-lijsten",null);
    S.inst=Object.assign({pins:{},beloningen:[],kinderen:[]},lsGet("oefenschrift-inst",{}));
    zetKinderen();
    if(!S.lijsten){S.lijsten=[];
      // Losse versie (bijvoorbeeld GitHub Pages): begin met de voorbeeldlijsten uit lijsten.json
      try{const r=await fetch("lijsten.json");if(r.ok){const d=await r.json();S.lijsten=Object.keys(d).map(id=>Object.assign({},d[id],{id}));lsSet("oefenschrift-lijsten",S.lijsten)}}catch(e){}}
    S.laden=false;zachtRender();return;
  }
  opslag.db=db;S.modus="db";
  const timer=setTimeout(()=>{if(S.laden){S.laadTraag=true;zachtRender()}},10000);
  let lijstOk=false,instOk=false;
  const klaar=()=>{if(lijstOk&&instOk){S.laden=false;S.laadTraag=false;clearTimeout(timer)}};
  db.collection("lijsten").onSnapshot(snap=>{
    S.lijsten=snap.docs.map(d=>Object.assign({},kloon(d.data()),{id:d.id}));
    if(!snap.metadata.fromCache)lijstOk=true;klaar();zachtRender();
  },()=>{lijstOk=true;klaar();zachtRender()});
  db.doc("instellingen/algemeen").onSnapshot(snap=>{
    if(opslag.instBezig)return;
    S.inst=Object.assign({pins:{},beloningen:[],kinderen:[]},snap.exists?kloon(snap.data()):{});zetKinderen();
    if(!snap.metadata.fromCache)instOk=true;klaar();zachtRender();
  },()=>{instOk=true;klaar();zachtRender()});
}
function volgVoortgang(kid){
  opslag.gevolgd=opslag.gevolgd||{};if(opslag.gevolgd[kid])return;opslag.gevolgd[kid]=true;
  if(S.modus!=="db"){S.vg[kid]=vulAan(lsGet("oefenschrift-vg-"+kid,{}));return}
  opslag.db.doc("voortgang/"+kid).onSnapshot(snap=>{
    if(opslag.vuil[kid]||opslag.bezig[kid])return;
    S.vg[kid]=vulAan(snap.exists?kloon(snap.data()):{});zachtRender();
  },()=>{});
}
function bewaarVg(kid){
  if(S.modus!=="db"){lsSet("oefenschrift-vg-"+kid,S.vg[kid]);return}
  opslag.vuil[kid]=true;clearTimeout(opslag.timers[kid]);
  opslag.timers[kid]=setTimeout(()=>schrijfVg(kid),1200);
}
async function schrijfVg(kid){
  if(opslag.bezig[kid]){opslag.opnieuw[kid]=true;return}
  opslag.bezig[kid]=true;
  try{await opslag.db.doc("voortgang/"+kid).set(kloon(S.vg[kid]))}
  catch(e){S.melding="De voortgang kon niet worden opgeslagen. Controleer de internetverbinding."}
  opslag.bezig[kid]=false;
  if(opslag.opnieuw[kid]){opslag.opnieuw[kid]=false;return schrijfVg(kid)}
  opslag.vuil[kid]=false;
}
async function bewaarInst(){

async function bewaarLijst(l){
  const schoon=kloon(l);delete schoon.id;
  if(S.modus!=="db"){const i=S.lijsten.findIndex(x=>x.id===l.id);if(i>=0)S.lijsten[i]=l;else S.lijsten.push(l);lsSet("oefenschrift-lijsten",S.lijsten);return true}
  try{await opslag.db.doc("lijsten/"+l.id).set(schoon);return true}catch(e){return e&&e.code||"fout"}
}
async function verwijderLijst(id){
  if(S.modus!=="db"){S.lijsten=S.lijsten.filter(l=>l.id!==id);lsSet("oefenschrift-lijsten",S.lijsten);return}
  try{await opslag.db.doc("lijsten/"+id).delete()}catch(e){S.melding="Verwijderen lukte niet. Probeer het nog eens."}

function planner(l,p){
  const vandaag=dag();let start=vandaag,eind;
  if(l.toets&&dagenTot(l.toets)>=0){eind=l.toets;const eerst=(p.dagen||[]).slice().sort()[0];if(eerst&&eerst<start&&dagenTot(eerst)>-7)start=eerst}
  else{start=plusDagen(vandaag,-6);eind=vandaag}
  let cellen="";let d=start,n=0;
  while(d<=eind&&n<14){const dt=vanIso(d);const kl=["dag"];if((p.dagen||[]).includes(d))kl.push("gedaan");if(d===vandaag)kl.push("vandaag");if(d===l.toets)kl.push("toetsdag");
    cellen+='<div class="'+kl.join(" ")+'">'+DAGNAMEN[dt.getDay()]+"<b>"+dt.getDate()+"</b></div>";d=plusDagen(d,1);n++}
  return'<div class="planner">'+cellen+"</div>";
}

/* ---------- sessie (EDI: lesdoel, ik doe het voor, samen, controle, zelf) ---------- */
function opties(item,veld,aantal){
  const l=lijst();const its=itemsVan(l).filter(i=>i.key!==item.key&&!!i.zin===!!item.zin&&eerste(i[veld])!==eerste(item[veld]));
  const pool=its.length>=aantal-1?its:itemsVan(l).filter(i=>i.key!==item.key);
  const gezien=new Set([eerste(item[veld])]);const uit=[];
  for(const i of schud(pool)){const t=eerste(i[veld]);if(!gezien.has(t)){gezien.add(t);uit.push(t)}if(uit.length>=aantal-1)break}
  return schud([eerste(item[veld])].concat(uit));
}
function typeEngels(it,b){
  if(it.zin){
    if(b<=1)return"kies-nl";
    if(b===2)return it.situatie?"situatie-kies":"kies-en";
    if(b===3)return"zin-puzzel";
    return"typ-en";
  }
  if(b<=1)return kanPraten&&S.geluid&&Math.random()<.4?"luister":"kies-nl";
  if(b===2)return"kies-en";
  if(b===3)return Math.random()<.6?"puzzel":"typ-nl";
  return Math.random()<.7?"typ-en":"typ-nl";
}
function makkelijker(type){return{"typ-en":"puzzel","typ-nl":"kies-nl","puzzel":"kies-en","zin-puzzel":"kies-en","situatie-kies":"kies-en"}[type]||type}
function startSessie(modus){
  const l=lijst();const kid=S.kind;const p=lv(kid,l.id);const items=itemsVan(l);const vandaag=dag();
  let rij=[];
  const nieuw=schud(items.filter(i=>bak(p,i.key)===0));
  const oud=items.filter(i=>bak(p,i.key)>0).sort((a,b)=>{
    const pa=p.it[a.key],pb=p.it[b.key];const da=(pa.n||"")<=vandaag?0:1,db=(pb.n||"")<=vandaag?0:1;
    return da-db||pa.b-pb.b||Math.random()-.5});
  if(modus==="toets"){
    rij=schud(items).map(it=>({it,type:l.soort==="spelling"?"dictee":(Math.random()<.6?"typ-en":"typ-nl"),fase:"zelf"}));
  }else if(l.soort==="spelling"){
    const zwak=oud.filter(i=>bak(p,i.key)<=2).length;
    const nNieuw=Math.min(nieuw.length,Math.max(3,8-zwak));
    const gekozen=schud(nieuw.slice(0,nNieuw).concat(oud.slice(0,Math.max(0,8-nNieuw))));
    const lastig=gekozen.filter(it=>bak(p,it.key)<=2);
    rij.push({type:"lesdoel",fase:"doel",it:{},aantal:gekozen.length,cats:[...new Set(gekozen.map(i=>i.cat))]});
    const voorbeelden=[];const gezienCat=new Set();
    lastig.forEach(it=>{if(voorbeelden.length<2&&!gezienCat.has(it.cat)){gezienCat.add(it.cat);voorbeelden.push(it)}});
    voorbeelden.forEach(it=>rij.push({it,type:"model",fase:"voor"}));
    gekozen.forEach((it,i)=>{const b=bak(p,it.key);const fase=i<3?"samen":"zelf";
      if(i===3&&gekozen.length>3)rij.push({type:"check",fase:"check",it:{}});
      if(b<=2)rij.push({it,type:"cat",fase});rij.push({it,type:"schrijf",fase})});
  }else{
    const zwak=oud.filter(i=>bak(p,i.key)<=2).length;
    const dichtbij=l.toets&&dagenTot(l.toets)>=0&&dagenTot(l.toets)<=1;
    const nNieuw=Math.min(nieuw.length,dichtbij?8:Math.max(3,Math.min(6,10-zwak)));
    const intro=nieuw.slice(0,nNieuw);
    const oudKeus=oud.slice(0,Math.max(0,10-intro.length));
    rij.push({type:"lesdoel",fase:"doel",it:{},aantal:intro.length,herhaal:oudKeus.length});
    intro.forEach((it,i)=>rij.push({it,type:"intro",fase:"voor",nr:i+1,van:intro.length}));
    if(intro.length){
      schud(intro).forEach(it=>rij.push({it,type:"kies-nl",fase:"samen"}));
      rij.push({type:"check",fase:"check",it:{}});
    }
    let vragen=schud(intro.concat(oudKeus)).map(it=>({it,type:typeEngels(it,Math.max(2,bak(p,it.key))),fase:"zelf"}));
    rij=rij.concat(vragen);
  }
  if(!rij.length){S.melding="Deze lijst heeft nog geen woorden.";return ga("lijst")}
  S.sessie={lijstId:l.id,soort:l.soort,modus,rij,i:0,goedEerst:0,vragen:0,munten:0,reeks:0,log:[],hint:0,catFout:{},verlengd:false};
  ga("sessie");
}

function stOf(it){const p=lv(S.kind,S.sessie.lijstId);return p.it[it.key]||(p.it[it.key]={b:0,g:0,f:0})}
function zetBak(st,b){st.b=Math.max(0,Math.min(5,b));st.n=plusDagen(dag(),INTERVAL[st.b]);st.t=dag()}
function verwerk(uitslag,gegeven,juist){
  const s=S.sessie;const q=huidigeVraag();q.klaar=true;q.uitslag=uitslag;q.gegeven=gegeven;
  const st=stOf(q.it);const eersteKeer=!q.herhaling;
  if(eersteKeer)s.vragen++;
  if(s.modus==="toets"){
    if(uitslag==="goed"){st.g=(st.g||0)+1;if(st.b<4)zetBak(st,Math.max(st.b,3));s.goedEerst++}
    else{st.f=(st.f||0)+1;zetBak(st,1)}
    s.log.push({it:q.it,uitslag,gegeven,type:q.type,fase:q.fase});
    bewaarVg(S.kind);return volgende();
  }
  const telt=q.fase==="zelf"||q.type==="schrijf";
  if(q.type==="cat"){
    if(uitslag!=="goed")s.catFout[q.it.cat]=(s.catFout[q.it.cat]||0)+1;
  }else if(eersteKeer&&telt){
    if(uitslag==="goed"&&!s.hint){zetBak(st,st.b+1);st.g=(st.g||0)+1}
    else if(uitslag==="goed"){zetBak(st,Math.max(1,st.b))}
    else if(uitslag==="bijna"){zetBak(st,Math.max(1,st.b-1));st.f=(st.f||0)+1}
    else{zetBak(st,1);st.f=(st.f||0)+1}
  }else if(!telt&&uitslag!=="goed"){st.f=(st.f||0)+1}
  if(uitslag==="goed"&&!s.hint&&eersteKeer){s.goedEerst++;geef(MUNT.goed);s.reeks++;
    if(s.reeks%5===0){geef(MUNT.reeks5);q.bonus=true}}
  else s.reeks=0;
  if(uitslag!=="goed"&&!q.herhaling&&q.type!=="cat"&&q.fase==="zelf"){
    s.rij.splice(Math.min(s.rij.length,s.i+4),0,{it:q.it,type:s.soort==="spelling"?"schrijf":makkelijker(q.type),herhaling:true,fase:"zelf"});
  }
  if(q.type!=="intro")s.log.push({it:q.it,uitslag,gegeven,type:q.type,fase:q.fase,herhaling:!!q.herhaling,hint:s.hint>0});
  bewaarVg(S.kind);
  toon(uitslag==="goed"?"goed":"fout");
  terugkoppeling(uitslag,gegeven,juist,q);
}

function nieuwId(p){return(p||"l")+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function engelsNaarTekst(items){return(items||[]).map(i=>i.en+" = "+i.nl+(i.situatie?" | "+i.situatie:"")).join("\n")}
function parseEngels(t){
  const items=[],fout=[];
  String(t).split("\n").forEach(r=>{const x=r.trim();if(!x)return;const [hoofd,...sit]=x.split("|");const d=hoofd.split("=");
    if(d.length<2||!d[0].trim()||!d.slice(1).join("=").trim()){fout.push(x);return}
    const en=d[0].trim(),nl=d.slice(1).join("=").trim();const zin=/[?.!]$/.test(en)||en.split(/\s+/).length>=4;
    const it={en,nl,zin};if(sit.join("|").trim())it.situatie=sit.join("|").trim();items.push(it)});
  return{items,fout};
}
function parseSpelling(t,cats){
  const items=[];const gezien=new Set();
  String(t).split(/[\n,;]+/).forEach(r=>{const w=r.split(/[=|]/)[0].trim();if(!w||gezien.has(w.toLowerCase()))return;gezien.add(w.toLowerCase());items.push({w,cat:cats[w]||raadCat(w)})});
  return items;
}

function foutTekst(c){return c==="not_granted"||c==="sampling_disabled"?"Claude staat hier uit. Doe het zelf.":c==="image_rejected"?"Deze foto lukt niet. Probeer een andere, scherpere foto.":c==="rate_limited"?"Even te vaak gevraagd. Probeer het over een paar minuten nog eens.":"Het lukte niet. Probeer het nog eens."}
async function fotoLezen(bestand){
  const st=$("#fotostatus");const b=S.bewerk;if(!b)return;
  const sample=await haalSample();if(!sample){st.textContent="Foto lezen werkt hier niet. Typ de woorden zelf.";return}
  st.textContent="Claude leest de foto… dit kan een halve minuut duren.";
  const sp=b.l.soort==="spelling";
  const prompt=sp?
    "Dit is een foto van spellinghuiswerk van een kind op een Nederlandse basisschool (methode STAAL). Haal alle Nederlandse oefenwoorden eruit. Geef bij elk woord de spellingcategorie. Kies uit deze ids: "+CAT_IDS.map(c=>c+" ("+CATS[c].naam+")").join(", ")+". Vandaag is "+dag()+". Staat er een toetsdatum op, geef die als YYYY-MM-DD. Antwoord met alleen JSON: {\"titel\": string, \"thema\": string|null, \"toets\": string|null, \"items\": [{\"w\": string, \"cat\": string}]}"
    :"Dit is een foto van huiswerk Engels van een kind op een Nederlandse basisschool. Haal alle Engelse woorden en zinnen eruit met de Nederlandse vertaling die op het blad staat. Zet zin op true bij zinnetjes. Geef bij elk zinnetje een korte situatie in het Nederlands (één zin, voor een kind van 8 tot 12) waarin je dat zinnetje zegt, zonder de vertaling te verklappen. Geef ook een kort thema in het Nederlands (2 tot 4 woorden). Vandaag is "+dag()+". Staat er een toetsdatum op, geef die als YYYY-MM-DD. Antwoord met alleen JSON: {\"titel\": string, \"thema\": string|null, \"liedje\": string|null, \"les\": string|null, \"toets\": string|null, \"items\": [{\"en\": string, \"nl\": string, \"zin\": boolean, \"situatie\": string|null}]}";
  try{
    const r=await sample.json(prompt,{images:[bestand]});
    if(!r||!Array.isArray(r.items)||!r.items.length)throw{code:"leeg"};
    leesFormulier();
    if(sp){r.items.forEach(i=>{if(i&&i.w){b.cats[String(i.w)]=CAT_IDS.includes(i.cat)?i.cat:raadCat(i.w)}});b.tekst=r.items.filter(i=>i&&i.w).map(i=>String(i.w)).join("\n")}
    else b.tekst=engelsNaarTekst(r.items.filter(i=>i&&i.en&&i.nl).map(i=>({en:String(i.en),nl:String(i.nl),situatie:i.zin&&i.situatie?String(i.situatie):""})));
    if(!b.l.titel&&r.titel)b.l.titel=String(r.titel);
    if(!b.l.thema&&r.thema)b.l.thema=String(r.thema);
    if(!sp&&!b.l.liedje&&r.liedje)b.l.liedje=String(r.liedje);
    if(!sp&&!b.l.les&&r.les)b.l.les=String(r.les);
    if(!b.l.toets&&r.toets&&/^\d{4}-\d{2}-\d{2}$/.test(r.toets))b.l.toets=r.toets;
    render();const s2=$("#fotostatus");if(s2)s2.innerHTML='<span style="color:var(--good);font-weight:700">Gelezen. Controleer de lijst hieronder voordat je bewaart.</span>';
  }catch(e){st.textContent=foutTekst(e&&e.code)}
}
async function maakTekst(){
  const b=S.bewerk;if(!b)return;leesFormulier();const st=$("#leesstatus");
  const sample=await haalSample();if(!sample){st.textContent="Claude is hier niet beschikbaar.";return}
  const sp=b.l.soort==="spelling";
  const woorden=sp?parseSpelling(b.tekst,b.cats).map(i=>i.w):parseEngels(b.tekst).items.map(i=>i.en);
  if(woorden.length<3){st.textContent="Zet eerst minstens drie woorden in de lijst.";return}
  st.textContent="Claude schrijft een tekst… dit kan een minuut duren.";
  const prompt="Schrijf een nieuwe, eigen korte leestekst voor een kind van 8 tot 12 jaar op een Nederlandse basisschool. Werk volgens close reading: het kind leest de tekst drie keer, elke keer met een ander doel. "+
    (sp?"De tekst is in het Nederlands (ongeveer 100 tot 140 woorden) en gebruikt zo veel mogelijk van deze spellingwoorden, precies zo gespeld: ":"De tekst is in eenvoudig Engels (niveau A1, ongeveer 80 tot 120 woorden) en gebruikt zo veel mogelijk van deze woorden en zinnetjes letterlijk: ")+woorden.join("; ")+". "+
    (b.l.thema?"Het thema is: "+b.l.thema+". ":"")+
    "Maak er een klein verhaal van met namen en een eenvoudige gebeurtenis. Geen bestaande personages, geen songteksten. Maak daarna vragen in het Nederlands, elk met 3 antwoordopties waarvan er één goed is: lezing 1 (doel: waar gaat de tekst over?) 2 vragen over de hoofdlijn; lezing 2 (doel: wat betekenen de woorden?) 3 vragen over betekenis van woorden uit de lijst in de zin waarin ze staan; lezing 3 (doel: denk dieper na) 3 waarom- of hoe-vragen waarvan het antwoord in de tekst te vinden is. Geef bij elke vraag een korte uitleg (één zin) die naar de tekst verwijst. "+
    'Antwoord met alleen JSON: {"titel": string, "alineas": [string], "lezingen": [{"doel": string, "vragen": [{"v": string, "opties": [string,string,string], "goed": 0|1|2, "uitleg": string}]}]}';
  try{
    const r=await sample.json(prompt,{modelTier:"default"});
    if(!r||!Array.isArray(r.alineas)||!Array.isArray(r.lezingen)||r.lezingen.length<3)throw{code:"leeg"};
    b.l.tekst={titel:String(r.titel||""),alineas:r.alineas.map(String).slice(0,8),lezingen:r.lezingen.slice(0,3).map(z=>({doel:String(z.doel||""),vragen:(z.vragen||[]).filter(v=>v&&Array.isArray(v.opties)&&v.opties.length>=2).slice(0,4).map(v=>({v:String(v.v),opties:v.opties.map(String),goed:Math.max(0,Math.min(v.opties.length-1,Number(v.goed)||0)),uitleg:String(v.uitleg||"")}))}))};
    render();const s2=$("#leesstatus");if(s2)s2.innerHTML='<span style="color:var(--good);font-weight:700">Leestekst gemaakt: '+esc(b.l.tekst.titel)+". Bewaar de lijst om hem te gebruiken.</span>";
  }catch(e){st.textContent=foutTekst(e&&e.code)}
}
function leesFormulier(){
  const b=S.bewerk;if(!b||!$("#e-titel"))return;
  b.l.titel=$("#e-titel").value.trim();b.l.toets=$("#e-toets").value;b.l.thema=$("#e-thema").value.trim();
  if($("#e-liedje"))b.l.liedje=$("#e-liedje").value.trim();
  if($("#e-les"))b.l.les=$("#e-les").value.trim();
  b.l.voor=[...document.querySelectorAll("input[name=voor]:checked")].map(x=>x.value);
  b.tekst=$("#e-tekst").value;
}
async function bewaarBewerk(){
  leesFormulier();const b=S.bewerk;const l=b.l;
  if(!l.titel){b.fout="Geef de lijst een naam.";return render()}
  if(KINDEREN.length&&!l.voor.length){b.fout="Kies voor wie de lijst is.";return render()}
  if(l.soort==="spelling")l.items=parseSpelling(b.tekst,b.cats);
  else l.items=parseEngels(b.tekst).items;
  if(l.items.length<2){b.fout="Zet minstens twee woorden in de lijst.";return render()}
  delete l.voorbeeld;
  const r=await bewaarLijst(l);
  if(r!==true){b.fout=r==="quota_exceeded"?"Er is geen ruimte meer. Verwijder eerst een oude lijst.":"Bewaren lukte niet. Controleer de internetverbinding en probeer het opnieuw.";return render()}
  S.bewerk=null;S.melding=null;ga("ouders");
}

document.addEventListener("submit",async e=>{
  const f=e.target;if(!f.dataset||!f.dataset.form)return;e.preventDefault();
  const soort=f.dataset.form;
  if(soort==="typ"){
    const q=huidigeVraag();if(!q||q.klaar)return;const inp=$("#antwoord");const v=inp.value.trim();if(!v){inp.focus();return}
    let juist,uitslag;
    if(q.type==="typ-en"){juist=eerste(q.it.en);uitslag=beoordeel(v,q.it.en,"en")}
    else if(q.type==="typ-nl"){juist=eerste(q.it.nl);uitslag=beoordeel(v,q.it.nl,"nl")}
    else{juist=q.it.w;uitslag=v.toLowerCase()===juist.toLowerCase()?"goed":(lev(v.toLowerCase(),juist.toLowerCase())<=1&&juist.length>=4?"bijna":"fout")}
    verwerk(uitslag,v,juist);
  }else if(soort==="overtypen"){
    const q=huidigeVraag();const inp=$("#over");const spelling=S.sessie.soort==="spelling";
    const juist=spelling?q.it.w:(q.type==="typ-nl"?eerste(q.it.nl):eerste(q.it.en));
    const ok=spelling?inp.value.trim().toLowerCase()===juist.toLowerCase():beoordeel(inp.value,juist,q.type==="typ-nl"?"nl":"en")==="goed";
    if(ok)volgende();else{inp.classList.remove("schud");void inp.offsetWidth;inp.classList.add("schud");inp.select()}
  }else if(soort==="poort"){
    const v=+$("#poortantwoord").value.trim();
    if(v===S.poort.a*S.poort.b){S.ouder=true;S.poort=null;ga("ouders")}
    else{$("#poortfout").innerHTML='<div class="melding">Dat klopt niet. Probeer het nog eens.</div>'}
  }else if(soort==="bewaar"){bewaarBewerk()}
  else if(soort==="naam"){const n=$("#figuurnaam").value.trim().slice(0,16);S.vg[S.kind].figuur.naam=n;bewaarVg(S.kind);S.melding=null;render()}
  else if(soort==="kind"){
    const naam=$("#kind-naam").value.trim().slice(0,20);const kleur=parseInt($("#kind-kleur").value,10)||0;
    if(!naam){S.melding="Vul een voornaam in.";return render()}
    S.inst.kinderen=(S.inst.kinderen||[]).concat({id:nieuwId("k"),naam,kleur});zetKinderen();await bewaarInst();render();
  }
  else if(soort==="beloning"){
    const naam=$("#bel-naam").value.trim();const prijs=parseInt($("#bel-prijs").value,10);
    if(!naam||!(prijs>0)){S.melding="Vul een naam en een aantal munten in.";return render()}
    S.inst.beloningen=(S.inst.beloningen||[]).concat({id:nieuwId("b"),naam:naam.slice(0,60),prijs:Math.min(9999,prijs)});
    await bewaarInst();render();
  }else if(soort==="pins"){
    const pins={};let fout=false;
    KINDEREN.forEach(c=>{const v=$("#pin-"+c.id).value.trim();if(v){if(/^\d{4}$/.test(v))pins[c.id]=v;else fout=true}});
    if(fout){S.melding="Een code bestaat uit precies vier cijfers.";return render()}
    S.inst.pins=pins;S.ontgrendeld={};if(await bewaarInst())S.melding=null;render();
    const k=document.querySelector("[data-form=pins] button");if(k){k.textContent="Bewaard";}
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="e-tekst"&&S.bewerk){S.bewerk.tekst=e.target.value;clearTimeout(renderVoorbeeld.t);renderVoorbeeld.t=setTimeout(renderVoorbeeld,300)}
});
document.addEventListener("change",e=>{
  if(e.target.matches("#voorbeeld select")&&S.bewerk){S.bewerk.cats[e.target.dataset.w]=e.target.value}
  if(e.target.id==="e-foto"&&e.target.files&&e.target.files[0])fotoLezen(e.target.files[0]);
});

render();
startOpslag();
})();
</script>
